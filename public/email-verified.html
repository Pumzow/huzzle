<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Your Huzzle email has been verified." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./email-verified.css" />
    <title>Email verified · Huzzle</title>
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="./" aria-label="Huzzle home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Huzzle</span>
      </a>

      <section class="verification-card" aria-labelledby="page-title">
        <div class="checkmark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="m12 25 8 8 17-18" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="eyebrow">Account ready</p>
        <h1 id="page-title">Your email is verified.</h1>
        <p class="lede">Nice work. Your Huzzle account is all set, so you can keep your progress, chase the leaderboard, and solve from anywhere.</p>
        <a class="action" href="./">Start solving</a>
        <a class="secondary-link" href="./">Return to Huzzle</a>
        <p class="fine-print">You can close this tab now. Your verification is safely saved to your account.</p>
      </section>
    </main>
  </body>
</html>
